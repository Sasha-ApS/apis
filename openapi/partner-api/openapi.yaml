    restrictedRecord:
      summary: Record restricting the media to a publisher with an embargo
      value:
        share_state: "restricted"
        allowed_publish_urls:
          - "https://news.example.com/articles/"
        allowed_source_urls:
          - "https://cdn.example.com"
        allowed_from: "2026-07-01T06:00:00Z"
        byline: "Photo by Jane Doe"
        purchase_url: "https://license.example.com/photos/123"
    patchRecordByline:
      summary: Update only the byline, leaving other fields unchanged
      value:
        byline: "Photo by Jane Doe / Example Agency"
    restrictedRecordWithTimestamps:
      summary: Stored Record including server-set timestamps
      value:
        share_state: "restricted"
        allowed_publish_urls:
          - "https://news.example.com/articles/"
        allowed_source_urls:
          - "https://cdn.example.com"
        allowed_from: "2026-07-01T06:00:00Z"
        byline: "Photo by Jane Doe"
        purchase_url: "https://license.example.com/photos/123"
        custom_fields:
          internal_asset_id:
            string_value: "asset-9f3c"
          is_exclusive:
            boolean_value: true
        created_at: "2026-06-15T10:00:00Z"
        updated_at: "2026-06-20T08:30:00Z"
    recordValidationErrorSingleViolation:
      summary: Record write rejected because purchase_url is not an https URL
      value:
        message: "purchase_url must use the https: protocol"
        request_id: "8f14e45f-ceea-467a-9f0b-2b3a2c5a7d61"
        details:
          - field: "purchase_url"
            reason: "UNSUPPORTED_SCHEME"
            description: "purchase_url must use the https: protocol"
    recordValidationErrorMultipleViolations:
      summary: Record write rejected for several fields at once
      value:
        message: "purchase_url must use the https: protocol (+2 more)"
        request_id: "2c3f9b7d-5a41-4a53-8f2e-9b7a1c0d4e62"
        details:
          - field: "purchase_url"
            reason: "UNSUPPORTED_SCHEME"
            description: "purchase_url must use the https: protocol"
          - field: "allowed_publish_urls[1]"
            reason: "INVALID_PATTERN"
            description: "allowed_publish_urls[1]: wildcard is only allowed as the leftmost label"
          - field: "purchaseUrl"
            reason: "UNKNOWN_FIELD"
            description: "purchaseUrl is not a field of Record; Record fields use snake_case names"
    embedRecordValidationError:
      summary: Embed request rejected because the Record it carries is invalid
      value:
        message: "record.purchase_url must use the https: protocol"
        request_id: "5d1a6c22-8e3f-4b19-9d77-0f4c6a2b8e13"
        details:
          - field: "record.purchase_url"
            reason: "UNSUPPORTED_SCHEME"
            description: "record.purchase_url must use the https: protocol"

  schemas:
    AuthErrorResponse:
      # OAuth 2.0 Error Response
      # https://datatracker.ietf.org/doc/html/rfc6749#section-5.2
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: |
            The error code.
          enum:
            # The request is missing a required parameter, includes an unsupported parameter value
            # (other than grant type), repeats a parameter, includes multiple credentials,
            # utilizes more than one mechanism for authenticating the client, or is otherwise
            # malformed.
            - "invalid_request"

            # Client authentication failed (e.g., unknown client, no client authentication
            # included, or unsupported authentication method). The authorization server MAY return
            # an HTTP 401 (Unauthorized) status code to indicate which HTTP authentication schemes
            # are supported.  If the client attempted to authenticate via the "Authorization"
            # request header field, the authorization server MUST respond with an
            # HTTP 401 (Unauthorized) status code and include the "WWW-Authenticate" response
            # header field matching the authentication scheme used by the client.
            - "invalid_client"

            # The provided authorization grant (e.g., authorization code, resource owner credentials)
            # or refresh token is invalid, expired, revoked, does not match the redirection URI used
            # in the authorization request, or was issued to another client.
            - "invalid_grant"

            # The authenticated client is not authorized to use this authorization grant type.
            - "unauthorized_client"

            # The authorization grant type is not supported by the authorization server.
            - "unsupported_grant_type"

            # The requested scope is invalid, unknown, malformed, or exceeds the scope granted by the resource owner.
            - "invalid_scope"
        error_description:
          type: string
          description: |
            Human-readable text providing additional information, used to assist the client
            developer in understanding the error that occurred.
        error_uri:
          type: string
          description: |
            A URI identifying a human-readable web page with information about the error, used to
            provide the client developer with additional information about the error.

    ErrorResponse:
      type: object
      required:
        - message
      description: |
        The error payload returned by the Signature, Job and Record endpoints.

        `message` is always present. `request_id` and `details` are added when available, so a
        client that reads `message` only keeps working unchanged.
      properties:
        message:
          type: string
          description: |
            Human-readable summary of the failure.

            On a validation failure this is the first `details` entry's `description`, suffixed
            with ` (+N more)` when the request has more than one violation. English, not
            localized, and the wording is not stable across releases — never parse or branch on
            it; branch on `details[].reason` instead.
          examples:
            - "purchase_url must use the https: protocol (+2 more)"
        request_id:
          type: string
          description: |
            The identifier of the request that failed, mirroring the `SASHA-Request-ID`
            response header. Quote it when contacting SASHA support: it is what joins your
            call to the server-side logs.
          examples:
            - "8f14e45f-ceea-467a-9f0b-2b3a2c5a7d61"
        details:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/FieldViolation"
          description: |
            The field violations that caused the request to be rejected.

            Present on validation failures only; absent on every other kind of error. A request
            with more than 20 violations reports the first 20.

    FieldViolation:
      type: object
      required:
        - field
        - reason
        - description
      description: |
        A single field of the request that was rejected, and why.
      properties:
        field:
          type: string
          description: |
            Path of the offending field, in request-body naming. Array entries are indexed and
            map entries are keyed, e.g. `purchase_url`, `allowed_publish_urls[2]`,
            `custom_fields["asset_id"].string_value`.
          examples:
            - "allowed_publish_urls[2]"
        reason:
          type: string
          description: |
            Machine-readable cause of the violation — the value to branch on:
            * `REQUIRED`: A field the request cannot omit was not provided
            * `INVALID_TYPE`: The value has the wrong JSON type for the field
            * `INVALID_FORMAT`: The value has the right type but is not well-formed for the field, e.g. an unparsable URL or timestamp, or a fixed-length value of the wrong length
            * `UNSUPPORTED_SCHEME`: A URL uses a scheme the field does not accept (only `https` is accepted)
            * `FORBIDDEN_USERINFO`: A URL carries userinfo (`user:password@`), which is never accepted
            * `FORBIDDEN_HOST`: A URL points at a host the field does not accept, such as an IP literal or localhost
            * `TOO_LONG`: The value is longer than the field allows
            * `TOO_MANY`: The list or map holds more entries than the field allows
            * `INVALID_CHARACTERS`: The value contains characters the field does not accept, such as control characters
            * `UNKNOWN_VALUE`: The value is not one of the values the field defines, e.g. an unknown `share_state`
            * `NOT_ALLOWED_HERE`: The field is well-formed but not allowed in this combination, e.g. a distribution field on a `private` Record
            * `EXACTLY_ONE_REQUIRED`: Exactly one of a group of mutually exclusive properties must be set, e.g. the typed value of a `custom_fields` entry
            * `UNKNOWN_FIELD`: The body carries a field the endpoint does not define — commonly a misspelling, or a camelCase spelling of a snake_case field
            * `EMPTY`: The value is present but empty where a value is required
            * `INVALID_PATTERN`: A URL pattern is malformed and cannot be interpreted

            The set is closed, but it may be extended with new reasons. Treat a `reason` you do
            not recognise as a generic validation failure rather than failing hard.
          enum:
            - "REQUIRED"
            - "INVALID_TYPE"
            - "INVALID_FORMAT"
            - "UNSUPPORTED_SCHEME"
            - "FORBIDDEN_USERINFO"
            - "FORBIDDEN_HOST"
            - "TOO_LONG"
            - "TOO_MANY"
            - "INVALID_CHARACTERS"
            - "UNKNOWN_VALUE"
            - "NOT_ALLOWED_HERE"
            - "EXACTLY_ONE_REQUIRED"
            - "UNKNOWN_FIELD"
            - "EMPTY"
            - "INVALID_PATTERN"
          examples:
            - "UNSUPPORTED_SCHEME"
        description:
          type: string
          description: |
            Human-readable explanation of this violation, safe to log and to show to a developer.

            It may name the offending field or map key and state the limit that applies, but it
            never echoes the value that was submitted. English, not localized, and the wording is
            not stable across releases — never parse or branch on it.
          examples:
            - "purchase_url must use the https: protocol"

    UnauthorizedResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string

    GetTokenRequest:
      type: object
      required:
        - grant_type
      properties:
        grant_type:
          type: string
          description: |
            The grant type. Must be "client_credentials".
          examples:
            - "client_credentials"

    GetTokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          description: An access token that can be provided in subsequent calls, for example, to SASHA Partner API services.
        token_type:
          type: string
          description: |
            How the access token may be used. Always "Bearer".
          examples:
            - "Bearer"
        expires_in:
          type: integer
          description: The time period (in seconds) for which the access token is valid.

    JobStatus:
      type: string
      enum:
        - pending
        - completed
        - failed
      description: |
        The status of the job:
        * `pending`: The job has been accepted and is waiting to be processed
        * `completed`: The job is completed successfully
        * `failed`: The job failed with an error

    EmbedSignatureFromURLRequest:
      type: object
      required:
        - media_url
      properties:
        media_url:
          type: string
          description: The URL of the media file to protect by embedding the SASHA Signature into
          examples:
            - "https://example.com/image.jpg"
        media_mime_type:
          type: string
          description: |
            The MIME type of the media file at the given URL.

            If not provided, the MIME type will be inferred from the URL.

            The following MIME types are currently supported:
            - `image/jpeg`
            - `image/png`
            - `image/webp`

            For the most up-to-date list of supported formats and other
            media constraints, see the [Supported Formats reference](https://developer.sasha.eu/partner-api/api-reference/supported-formats).
          examples:
            - "image/jpeg"
        callback_secret_id:
          type: string
          description: |
            Optional identifier of the Callback Secret SASHA should use to sign the
            callback payload for this job.

            Each Callback Secret you have configured with SASHA has a unique
            Callback Secret ID. Pass it here to pin a job's callback signature to
            a specific secret — useful while rotating secrets, or when different
            parts of your system verify callbacks with different keys.

            If omitted, SASHA picks one of your enabled Callback Secrets
            automatically. The Callback Secret that was actually used is always
            returned in the `SASHA-Callback-Secret-ID` HTTP header on the
            callback request, so your endpoint can look up the matching signing
            key when validating the `SASHA-Request-Signature`.
          examples:
            - "177F01DA-34F2-4318-9763-B73876FDD7FA"
        callback_url:
          type: string
          format: uri
          description: Optional callback URL to receive job status notifications
          examples:
            - "https://your-app.com/callbacks/sasha-job-update"
        record:
          $ref: "#/components/schemas/Record"
          description: |
            Optional Record to attach to the resulting signature, carrying the
            creator's declared distribution intent and display metadata.

            Validated at submit: an invalid Record fails the request with a `400`
            and creates no job. Read-only fields are ignored.

    EmbedSignatureFromDataRequest:
      type: object
      required:
        - media
      properties:
        media:
          type: string
          # "format" is deprecated, we should use contentMediaType instead
          # but we need to keep it for backward compatibility as not all
          # clients support contentMediaType
          format: binary
          contentMediaType: application/octet-stream
          description: The media file to protect by embedding the SASHA Signature into
        callback_secret_id:
          type: string
          description: |
            Optional identifier of the Callback Secret SASHA should use to sign the
            callback payload for this job.

            Each Callback Secret you have configured with SASHA has a unique
            Callback Secret ID. Pass it here to pin a job's callback signature to
            a specific secret — useful while rotating secrets, or when different
            parts of your system verify callbacks with different keys.

            If omitted, SASHA picks one of your enabled Callback Secrets
            automatically. The Callback Secret that was actually used is always
            returned in the `SASHA-Callback-Secret-ID` HTTP header on the
            callback request, so your endpoint can look up the matching signing
            key when validating the `SASHA-Request-Signature`.
          examples:
            - "177F01DA-34F2-4318-9763-B73876FDD7FA"
        callback_url:
          type: string
          format: uri
          description: Optional callback URL to receive job status notifications
          examples:
            - "https://your-app.com/callbacks/sasha-job-update"
        record:
          $ref: "#/components/schemas/Record"
          description: |
            Optional Record to attach to the resulting signature, carrying the
            creator's declared distribution intent and display metadata.

            Send it as a JSON-encoded string in a `record` form field with
            content type `application/json`, not as nested bracket fields.

            Validated at submit: an invalid Record fails the request with a `400`
            and creates no job. Read-only fields are ignored.

    EmbedSignatureResponse:
      type: object
      required:
        - job
      properties:
        job:
          $ref: "#/components/schemas/Job"

    Job:
      type: object
      required:
        - job_id
        - type
        - status
        - created_at
        - updated_at
      properties:
        job_id:
          type: string
          description: The ID of the job
        type:
          $ref: "#/components/schemas/JobType"
        status:
          $ref: "#/components/schemas/JobStatus"
        error:
          $ref: "#/components/schemas/JobError"
          description: |
            The error that occurred while processing the job, if the job `status` is `failed`
        output_url:
          type: string
          description: |
            The URL of the result media file (only populated if job `status` is `completed` and `type` is `embed-signature`)
          examples:
            - "https://storage.example.com/processed-image.jpg"
        output_url_expires_at:
          type: string
          format: date-time
          description: The date and time the output URL will expire
          examples:
            - "2025-01-01T00:00:00Z"
        signature_id:
          oneOf:
            - $ref: "#/components/schemas/SignatureID"
            - type: "null"
          description: |
            The Signature identifier (populated when job `status` is `completed`).
            Will be `null` if no signature was found in the image.
        creator_id:
          type: integer
          description: |
            The Creator ID of the business entity that owns the found signature (populated when job
            `status` is `completed`, `type` is `lookup-signature`, and a signature was found — that
            is, exactly when `signature_id` is populated). A lookup never reports a signature
            without its creator.
          format: uint32
          minimum: 0
          maximum: 4294967295
          examples:
            - 1234567890
        guidance:
          $ref: "#/components/schemas/Guidance"
          description: |
            SASHA-evaluated distribution guidance for the found signature (populated when job
            `status` is `completed`, `type` is `lookup-signature`, and an active signature was
            found). A signature without a Record yields guidance with the `private` share state.
        record:
          $ref: "#/components/schemas/Record"
          description: |
            A field-filtered Record for the found signature. Populated only when job `status` is
            `completed`, `type` is `lookup-signature`, an active signature was found, and the
            partner is the owning creator (full Record) or has been granted access (granted fields
            only). Absent for all other lookers and never present for revoked signatures.

            Availability is time-bounded: the disclosed Record is retained for a limited window
            after completion, so it may be absent on jobs fetched later even though `guidance`
            remains. Use `GET /signature/{signature_id}/record` for durable read-back of a Record you own.
        created_at:
          type: string
          format: date-time
          description: The date and time the job was created
          examples:
            - "2025-01-01T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          description: The date and time the job was last updated
          examples:
            - "2025-01-01T00:00:00Z"

    JobError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: |
            Error codes:
            * `failed_to_fetch_from_url`: There was an issue fetching image from the provided image URL
            * `image_already_protected`: The image is already protected with SASHA Signature
            * `image_load_failed`: The image is not a valid image e.g. corrupted or invalid format
            * `image_too_large`: The image is too large to process
            * `image_too_small`: The image is too small to process
            * `internal`: An internal error occurred
          enum:
            - "failed_to_fetch_from_url"
            - "image_already_protected"
            - "image_load_failed"
            - "image_too_large"
            - "image_too_small"
            - "internal"
        message:
          type: string
          description: A developer-facing error message
          examples:
            - "Unsupported image format"

    JobType:
      type: string
      enum:
        - "embed-signature"
        - "lookup-signature"
      description: |
        The type of the job:
        * `embed-signature`: The job is to embed a SASHA Signature into an image
        * `lookup-signature`: The job is to check if an image is already protected with SASHA Signature

    SignatureID:
      type: string
      description: |
        The globally unique identifier of the SASHA Signature embedded into the image.

        The SignatureID is an unsigned 64-bit integer.

        In JSON representation, the SignatureID is represented as a string.
      examples:
        - "12345678901234567890"

    ShareState:
      type: string
      enum:
        - "private"
        - "unrestricted"
        - "restricted"
      description: |
        The creator-declared share state of a protected media item:
        * `private`: The creator declared that the media is not intended to be distributed anywhere public
        * `unrestricted`: The creator declared no distribution restrictions for the media
        * `restricted`: The creator declared that the media is intended to be distributed only where the Record's distribution fields permit

        A share state describes only the intent the creator has declared to SASHA. It is not a
        statement about the legal status of the media; rights such as copyright apply independently.

    Record:
      allOf:
        - $ref: "#/components/schemas/RecordFields"
      required:
        - share_state
      description: |
        A Record attaches creator-declared distribution intent and display metadata to a signature.

        A lookup always returns coarse `guidance` (evaluated server-side). It may additionally
        return a field-filtered Record: the owning partner receives the full Record, a partner the
        owner has granted access to receives only the granted fields, and all other lookers receive
        no Record. The full Record is always readable by its owning partner via `GET /signature/{signature_id}/record`.

        Consistency rules (enforced on write):
        * `share_state` must be set
        * `private` and `unrestricted` Records must not carry any distribution fields
        * `restricted` Records may carry any subset of the distribution fields (`allowed_publish_urls`, `allowed_source_urls`, `allowed_from`, `allowed_to`), including none — the fields form a permit list, so a restricted Record with none of them permits no locations yet and conditions can be added later as they become known
        * `custom_fields` are display/metadata only and may be set under any share state

        Contradictory combinations are rejected.

        Size limits (enforced on write): at most 100 patterns per URL-pattern list, each at most
        2048 characters; at most 32 `custom_fields` entries with keys of 1-64 characters and
        string values of at most 1024 characters; a Record without `c2pa_manifest_store` must not
        exceed 64 KiB when serialized.

    RecordPatch:
      allOf:
        - $ref: "#/components/schemas/RecordFields"
      description: |
        A JSON Merge Patch (RFC 7386) for a Record: fields present in the patch replace the
        stored value (arrays and objects are replaced wholesale, not merged), fields set to
        `null` are cleared, and absent fields are left unchanged. The result must satisfy the
        Record consistency rules. Read-only fields are ignored.

    RecordFields:
      type: object
      properties:
        share_state:
          $ref: "#/components/schemas/ShareState"
        allowed_publish_urls:
          type: array
          items:
            type: string
          description: |
            URL patterns the browser-facing display URL of the media is allowed to match
            (only meaningful with the `restricted` share state).

            Pattern syntax:

            * `https` only. The scheme may be omitted; `https` is implied.
            * A host with no path matches any path on that host: `https://cdn.example.com`.
            * A path ending in `/` matches that prefix: `https://news.example.com/articles/`
              matches `/articles/123` but not `/archive/9`. A path not ending in `/` must match
              exactly.
            * `*.` is a subdomain wildcard, and is only allowed as the leftmost label:
              `https://*.example.com`. It cannot appear elsewhere, so `https://example.com/*`
              is not a valid pattern — omit the path instead. The base of a wildcard must have
              at least two labels and must not be a public suffix.
            * No userinfo, no query string, no fragment, no IP literals, no `localhost`.

            A pattern that does not parse is rejected with an `INVALID_PATTERN` field violation
            naming the entry, e.g. `allowed_publish_urls[1]`.
          examples:
            - ["https://news.example.com/articles/"]
        allowed_source_urls:
          type: array
          items:
            type: string
          description: |
            URL patterns the storage/CDN address of the media bytes is allowed to match
            (only meaningful with the `restricted` share state).

            Same pattern syntax as `allowed_publish_urls`.
          examples:
            - ["https://cdn.example.com"]
        allowed_from:
          type: string
          format: date-time
          description: The media is not allowed to be available before this time (supports embargo dates)
        allowed_to:
          type: string
          format: date-time
          description: The media is not allowed to be available after this time
        byline:
          type: string
          maxLength: 256
          description: |
            Display text the publisher is expected to show alongside the media (e.g. photographer credit).

            Plain text, no control characters. Consumers must always treat this value as text, never as markup.
          examples:
            - "Photo by Jane Doe"
        purchase_url:
          type: string
          format: uri
          maxLength: 2048
          description: |
            URL where the media can be purchased or licensed.

            Must be a well-formed https URL without userinfo, and must not point at an IP literal or localhost.
          examples:
            - "https://license.example.com/photos/123"
        licensee:
          type: string
          maxLength: 256
          description: |
            Legal business name of the entity that has licensed the media asset. Aids enforcers when
            the licence agreement is not bound to a specific location.

            Plain text, no control characters. Consumers must always treat this value as text, never as markup.
          examples:
            - "Example Media Group Ltd."
        asset_source_id:
          type: string
          maxLength: 256
          description: |
            The creator's own upstream source ID for the asset: the creator's identifier for the media
            in their own system.

            Opaque text, no control characters. A UUID (RFC 9562) is recommended but not required.
            Consumers must always treat this value as text, never as markup.
          examples:
            - "a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d"
        custom_fields:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/FieldValue"
          description: |
            Custom fields, keyed by a creator-chosen name. Custom fields are
            display/metadata only: they never participate in distribution guidance evaluation, so
            they may be set under any share state. Disclosure to other parties is governed by the
            creator's record-access policy (managed by SASHA on the creator's behalf).
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: The date and time the Record was first created
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: The date and time the Record was last replaced

    FieldValue:
      type: object
      minProperties: 1
      maxProperties: 1
      description: |
        A typed value for a custom Record field. Exactly one property is set, which
        pins the value's type. Custom fields are display/metadata only and never participate in
        distribution guidance evaluation.
      properties:
        boolean_value:
          type: boolean
        string_value:
          type: string
        int32_value:
          type: integer
          format: int32
        double_value:
          type: number
          format: double
        uuid_value:
          type: string
          format: byte
          description: A UUID per RFC 9562 as its 16 raw bytes, base64-encoded.

    Guidance:
      type: object
      required:
        - share_state
        - advice
      description: |
        SASHA-evaluated distribution guidance for a found signature.

        Guidance reflects the distribution intent the creator declared to SASHA. It is not a
        determination of the legal status of the media; rights such as copyright apply
        independently of the returned advice. The underlying Record contents are never disclosed,
        though the optional `message` may name domains from the Record's allowed URL patterns
        (domain names are public knowledge).
      properties:
        share_state:
          $ref: "#/components/schemas/ShareState"
        advice:
          type: string
          enum:
            - "allowed"
            - "not_allowed"
            - "inconclusive"
          description: |
            The verdict for the queried location and time:
            * `allowed`: Presence of the media at the queried location at the current time is consistent with the creator's declared distribution intent
            * `not_allowed`: Presence of the media at the queried location at the current time conflicts with the creator's declared distribution intent, or the creator declared the media as not intended for public distribution
            * `inconclusive`: No conclusive verdict could be produced, typically because the share state is `restricted` and no `publish_url` or `source_url` was supplied with the lookup
        message:
          type: string
          description: |
            Human-readable explanation of the verdict, e.g. "Only allowed on example.com".

            Populated at the server's discretion, typically when `advice` is `not_allowed` or
            `inconclusive`. For developer convenience only: English, not localized, and the
            wording is not stable across releases — never parse or branch on it; use `advice` and
            `share_state` for program logic. The text may name domains from the Record's allowed
            URL patterns (domain names are public knowledge and are not masked); it never carries
            full URL patterns or other raw Record content.
          examples:
            - "Only allowed on news.example.com"

    LookupSignatureFromURLRequest:
      type: object
      required:
        - media_url
      properties:
        media_url:
          type: string
          description: The URL of the media file to lookup the SASHA Signature from
          examples:
            - "https://example.com/image.jpg"
        publish_url:
          type: string
          description: |
            The browser-facing URL where the media is displayed or is about to be published.

            Used to evaluate the found signature's Record into distribution guidance on the
            completed job. Strongly recommended: without URL context, restricted media yields
            an inconclusive verdict.
          examples:
            - "https://news.example.com/articles/123"
        source_url:
          type: string
          description: |
            The URL the media bytes were fetched from (e.g. a CDN address).

            Used to evaluate the found signature's Record into distribution guidance on the
            completed job.
          examples:
            - "https://cdn.example.com/images/abc.jpg"
        media_mime_type:
          type: string
          description: |
            The MIME type of the media file at the given URL.

            If not provided, the MIME type will be inferred from the URL.

            The following MIME types are currently supported:
            - `image/jpeg`
            - `image/png`
            - `image/webp`

            For the most up-to-date list of supported formats and other
            media constraints, see the [Supported Formats reference](https://developer.sasha.eu/partner-api/api-reference/supported-formats).
          examples:
            - "image/jpeg"
        callback_secret_id:
          type: string
          description: |
            Optional identifier of the Callback Secret SASHA should use to sign the
            callback payload for this job.

            Each Callback Secret you have configured with SASHA has a unique
            Callback Secret ID. Pass it here to pin a job's callback signature to
            a specific secret — useful while rotating secrets, or when different
            parts of your system verify callbacks with different keys.

            If omitted, SASHA picks one of your enabled Callback Secrets
            automatically. The Callback Secret that was actually used is always
            returned in the `SASHA-Callback-Secret-ID` HTTP header on the
            callback request, so your endpoint can look up the matching signing
            key when validating the `SASHA-Request-Signature`.
          examples:
            - "177F01DA-34F2-4318-9763-B73876FDD7FA"
        callback_url:
          type: string
          format: uri
          description: Optional callback URL to receive job status notifications
          examples:
            - "https://your-app.com/callbacks/sasha-job-update"

    LookupSignatureFromDataRequest:
      type: object
      required:
        - media
      properties:
        media:
          type: string
          # "format" is deprecated, we should use contentMediaType instead
          # but we need to keep it for backward compatibility as not all
          # clients support contentMediaType
          format: binary
          contentMediaType: application/octet-stream
          description: The media file to lookup the SASHA Signature from
        publish_url:
          type: string
          description: |
            The browser-facing URL where the media is displayed or is about to be published.

            Used to evaluate the found signature's Record into distribution guidance on the
            completed job. Strongly recommended: without URL context, restricted media yields
            an inconclusive verdict.
          examples:
            - "https://news.example.com/articles/123"
        source_url:
          type: string
          description: |
            The URL the media bytes were fetched from (e.g. a CDN address).

            Used to evaluate the found signature's Record into distribution guidance on the
            completed job.
          examples:
            - "https://cdn.example.com/images/abc.jpg"
        callback_secret_id:
          type: string
          description: |
            Optional identifier of the Callback Secret SASHA should use to sign the
            callback payload for this job.

            Each Callback Secret you have configured with SASHA has a unique
            Callback Secret ID. Pass it here to pin a job's callback signature to
            a specific secret — useful while rotating secrets, or when different
            parts of your system verify callbacks with different keys.

            If omitted, SASHA picks one of your enabled Callback Secrets
            automatically. The Callback Secret that was actually used is always
            returned in the `SASHA-Callback-Secret-ID` HTTP header on the
            callback request, so your endpoint can look up the matching signing
            key when validating the `SASHA-Request-Signature`.
          examples:
            - "177F01DA-34F2-4318-9763-B73876FDD7FA"
        callback_url:
          type: string
          format: uri
          description: Optional callback URL to receive job status notifications
          examples:
            - "https://your-app.com/callbacks/sasha-job-update"

    LookupSignatureResponse:
      type: object
      required:
        - job
      properties:
        job:
          $ref: "#/components/schemas/Job"

    ListJobsResponse:
      type: object
      required:
        - jobs
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/Job"
          description: List of jobs
