openapi: "3.1.0"
info:
  title: SASHA Partner API
  summary: Protect images with SASHA Signature
  description: |
    This API allows protecting new images and checking if an image is already protected with SASHA Signature.

    ## Authenticate with Client Credentials

    To authenticate with Client Credentials, you need to send a request to the
    [`/oauth/token`](https://developer.sasha.eu/partner-api/api-reference/rest-api/get-token) endpoint.

    The server will authenticate the Partner and return an Access Token that can be used for making
    requests to the Signature endpoints.

    ## Protect an image with SASHA Signature

    To protect an image with SASHA Signature, you need to send a request to the
    [/signature/embed](https://developer.sasha.eu/partner-api/api-reference/rest-api/embed-signature) endpoint, providing
    the image file or the URL to the image file.

    The server will return a Job object with the job ID and status. Once the job is complete,
    the protected image file will be available at the `output_url` and the `signature_id` will be populated
    representing the globally unique identifier of the protected image.

    Partners may poll for the job status using the `/jobs/{job_id}` endpoint or provide a `callback_url` in
    the request to receive notifications when the job is complete.

    ## Check if an image is already protected with SASHA Signature

    To check if an image is already protected with SASHA Signature, you need to send a request to the
    [/signature/lookup](https://developer.sasha.eu/partner-api/api-reference/rest-api/lookup-signature) endpoint, providing
    the image file or the URL to the image file.

    The server will return a Job object with the job ID and status. Once the job is complete,
    the Job object will contain the `signature_id` and `creator_id` fields if a SASHA Signature is found.

    ## Records and Distribution Guidance

    Partners can attach a Record to a signature they registered using the `/signature/{signature_id}/record`
    endpoints. A Record carries the creator's declared distribution intent (where and when the media
    is allowed to appear) and display metadata.

    When a lookup finds a signature, the completed Job includes a `guidance` object: SASHA's
    evaluation of the found signature's Record against the `publish_url` and `source_url` provided
    in the lookup request. Guidance contains coarse values plus an optional human-readable
    `message`; the Record contents are never disclosed to the party performing the lookup, though
    the `message` may name domains from the Record's allowed URL patterns (domain names are public
    knowledge).

    ## Job Status and Callbacks

    All operations are asynchronous and return a Job object with a unique job_id. You can:

    1. **Poll for status**: Use the `/jobs/{job_id}` endpoint to check job status.
    2. **Callback notifications**: Provide a `callback_url` in your request to receive notifications when the job status changes.

    ## Callback Notifications

    If you provide a `callback_url` in your Embed Signature or Lookup Signature request, the system will send HTTP POST
    requests to that URL whenever the job status changes. The callback payload will contain the
    complete Job object with updated status information. Partners can use this callback to track the status of their
    jobs and get notified when the job is complete to get the result.

    Partners can validate the callback request to ensure it genuinely comes from SASHA and was not
    modified in transit, see callback documentation below.

    ## Error responses

    Every response carries a `SASHA-Request-ID` header identifying that request. Quote it when
    contacting SASHA support: it is what joins your call to the server-side logs.

    A failing request to the Signature, Job or Record endpoints returns an `ErrorResponse`:

    ```json
    {
      "message": "purchase_url must use the https: protocol (+2 more)",
      "request_id": "8f14e45f-ceea-467a-9f0b-2b3a2c5a7d61",
      "details": [
        {
          "field": "purchase_url",
          "reason": "UNSUPPORTED_SCHEME",
          "description": "purchase_url must use the https: protocol"
        }
      ]
    }
    ```

    - `message` is always present. On a validation failure it is the first `details` entry's
      `description`, suffixed with ` (+N more)` when the request has more than one violation.
    - `request_id` mirrors the `SASHA-Request-ID` response header.
    - `details` is present on validation failures only, and lists at most 20 violations. Each
      entry names the offending `field` in request-body naming (`purchase_url`,
      `allowed_publish_urls[2]`, `custom_fields["asset_id"].string_value`), a machine-readable
      `reason`, and a human-readable `description` that never echoes the value you submitted.

    Branch on `reason`, never on the text of `message` or `description`. The reason catalogue is
    `REQUIRED`, `INVALID_TYPE`, `INVALID_FORMAT`, `UNSUPPORTED_SCHEME`, `FORBIDDEN_USERINFO`,
    `FORBIDDEN_HOST`, `TOO_LONG`, `TOO_MANY`, `INVALID_CHARACTERS`, `UNKNOWN_VALUE`,
    `NOT_ALLOWED_HERE`, `EXACTLY_ONE_REQUIRED`, `UNKNOWN_FIELD`, `EMPTY` and `INVALID_PATTERN`;
    each value is documented on the `FieldViolation` schema. The set is closed, but it may be
    extended with new reasons — treat a `reason` you do not recognise as a generic validation
    failure rather than failing hard.

    The `/oauth/token` endpoint is the exception: it returns the OAuth 2.0 error shape
    (`error`, `error_description`, `error_uri`) defined by RFC 6749.
  contact:
    name: API Support
    email: support@sasha.eu
  version: "1.4.0"

externalDocs:
  description: SASHA Developer Portal
  url: https://developer.sasha.eu

servers:
  - url: https://partner.api.sasha.eu
    description: Partner API server

tags:
  - name: Authentication
    description: Authenticate Partner and get an Access Token
  - name: Embed
    description: Embed a SASHA Signature into an image
  - name: Lookup
    description: Check if a SASHA Signature is present in an image
  - name: Job
    description: Job management
  - name: Record
    description: Manage Records attached to signatures

paths:
  /oauth/token:
    post:
      tags:
        - Authentication
      summary: Get Token
      description: |
        Authenticate Partner and get an Access Token.

        The request should contain the Client ID and Client Secret passed as Basic Authentication credentials.
      operationId: GetToken
      security:
        - BasicAuth: []
      requestBody:
        description: Get Token Request
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/GetTokenRequest"
      responses:
        "200":
          description: Successful operation
          headers:
            SASHA-Request-ID:
              $ref: "#/components/headers/SASHA-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetTokenResponse"
        "400":
          description: Bad request
          headers:
            SASHA-Request-ID:
              $ref: "#/components/headers/SASHA-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "401":
          description: Unauthorized
          headers:
            SASHA-Request-ID:
              $ref: "#/components/headers/SASHA-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"

  /signature/embed:
    post:
      tags:
        - Embed
      summary: Embed Signature
      description: Embed a SASHA Signature into the provided image file
      operationId: EmbedSignature
      externalDocs:
        description: Embed Signature
        url: https://developer.sasha.eu/partner-api/concepts/signature#embed-signature
      security:
        - BearerAuth: []
      requestBody:
        description: Embed Signature Request
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbedSignatureFromURLRequest"
            examples:
              embedRequestFromURLWithCallback:
                $ref: "#/components/examples/embedRequestFromURLWithCallback"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/EmbedSignatureFromDataRequest"
            encoding:
              # The Record is an object, so it travels as a JSON-encoded string
              # in its own form field rather than as nested bracket fields.
              record:
                contentType: application/json
      callbacks:
        jobStatusChanged:
          $ref: "#/components/callbacks/jobStatusChanged"
      responses:
        "200":
          description: Successful operation
          headers:
            SASHA-Request-ID:
              $ref: "#/components/headers/SASHA-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbedSignatureResponse"
              examples:
                embedJobPending:
                  $ref: "#/components/examples/embedJobResponsePending"
        "400":
          $ref: "#/components/responses/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/UnauthorizedResponse"

  /signature/lookup:
    post:
      tags:
        - Lookup
      summary: Lookup Signature
      description: Check if the provided image contains SASHA Signature
      operationId: LookupSignature
      externalDocs:
        description: Lookup Signature
        url: https://developer.sasha.eu/partner-api/concepts/signature#lookup-signature
      security:
        - BearerAuth: []
      requestBody:
        description: Lookup Signature Request
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LookupSignatureFromURLRequest"
            examples:
              lookupRequestFromURLWithCallback:
                $ref: "#/components/examples/lookupRequestFromURLWithCallback"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/LookupSignatureFromDataRequest"
      callbacks:
        jobStatusChanged:
          $ref: "#/components/callbacks/jobStatusChanged"
      responses:
        "200":
          description: Successful operation
          headers:
            SASHA-Request-ID:
              $ref: "#/components/headers/SASHA-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LookupSignatureResponse"
              examples:
                lookupJobPending:
                  $ref: "#/components/examples/lookupJobResponsePending"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/UnauthorizedResponse"

  /jobs/{job_id}:
    get:
      tags:
        - Job
      summary: Get Job
      description: Gets job information by its ID
      operationId: GetJob
      security:
        - BearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the job to retrieve
      responses:
        "200":
          description: Successful operation
          headers:
            SASHA-Request-ID:
              $ref: "#/components/headers/SASHA-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
              examples:
                embedJobPending:
                  $ref: "#/components/examples/embedJobPending"
                lookupJobPending:
                  $ref: "#/components/examples/lookupJobPending"
                embedJobCompleted:
                  $ref: "#/components/examples/embedJobCompleted"
                lookupJobCompleted:
                  $ref: "#/components/examples/lookupJobCompleted"
                embedJobFailed:
                  $ref: "#/components/examples/embedJobFailed"
                lookupJobFailed:
                  $ref: "#/components/examples/lookupJobFailed"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"

  /jobs:
    get:
      tags:
        - Job
      summary: List Jobs
      description: Lists all jobs
      operationId: ListJobs
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Successful operation
          headers:
            SASHA-Request-ID:
              $ref: "#/components/headers/SASHA-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListJobsResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/UnauthorizedResponse"

  /signature/{signature_id}/record:
    parameters:
      - name: signature_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/SignatureID"
        description: The SignatureID of the signature whose Record to manage
    put:
      tags:
        - Record
      summary: Put Record
      description: |
        Create or fully replace the Record attached to a signature.

        This is a full-replace upsert: the stored Record becomes exactly the provided Record
        (last write wins, no field merging). It may be called for any signature registered by
        the partner, regardless of when the signature was registered.

        A signature without a Record is treated as private.

        Supports optimistic concurrency: pass the current `ETag` in an `If-Match` header to
        make the write conditional; a stale precondition returns `412 Precondition Failed`.
      operationId: PutSignatureRecord
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      security:
        - BearerAuth: []
      requestBody:
        description: The Record to store. Read-only fields are ignored.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Record"
            examples:
              restrictedRecord:
                $ref: "#/components/examples/restrictedRecord"
      responses:
        "204":
          description: The Record was stored
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            SASHA-Request-ID:
              $ref: "#/components/headers/SASHA-Request-ID"
        "400":
          $ref: "#/components/responses/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "409":
          description: The signature is revoked; its Record can no longer be modified.
          headers:
            SASHA-Request-ID:
              $ref: "#/components/headers/SASHA-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "412":
          $ref: "#/components/responses/PreconditionFailedResponse"
    patch:
      tags:
        - Record
      summary: Patch Record
      description: |
        Partially update the Record attached to a signature using JSON Merge Patch (RFC 7386).

        Fields present in the patch replace the stored value (arrays and objects are replaced
        wholesale, not merged), fields set to `null` are cleared, and absent fields are left
        unchanged. The patch applies against the currently attached Record (or an empty one
        when none is attached), and the resulting Record must satisfy the same consistency
        rules as a full replace; a contradictory result is rejected and the stored Record is
        left unchanged.

        Supports optimistic concurrency: pass the current `ETag` in an `If-Match` header to
        make the write conditional; a stale precondition returns `412 Precondition Failed`.
      operationId: PatchSignatureRecord
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      security:
        - BearerAuth: []
      requestBody:
        description: The Record fields to change.
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/RecordPatch"
            examples:
              patchRecordByline:
                $ref: "#/components/examples/patchRecordByline"
      responses:
        "204":
          description: The Record was updated
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            SASHA-Request-ID:
              $ref: "#/components/headers/SASHA-Request-ID"
        "400":
          $ref: "#/components/responses/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "409":
          description: The signature is revoked; its Record can no longer be modified.
          headers:
            SASHA-Request-ID:
              $ref: "#/components/headers/SASHA-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "412":
          $ref: "#/components/responses/PreconditionFailedResponse"
    get:
      tags:
        - Record
      summary: Get Record
      description: |
        Get the Record attached to a signature.

        Only the partner that registered the signature can read its Record; the full Record
        is never returned via lookup.
      operationId: GetSignatureRecord
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Successful operation
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            SASHA-Request-ID:
              $ref: "#/components/headers/SASHA-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Record"
              examples:
                restrictedRecord:
                  $ref: "#/components/examples/restrictedRecordWithTimestamps"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
    delete:
      tags:
        - Record
      summary: Delete Record
      description: |
        Delete the Record attached to a signature.

        Deleting a Record removes the attached metadata only; the signature itself remains
        valid and reverts to the default "no Record = private" interpretation.

        Deleting is idempotent: deleting a signature's Record when none is attached succeeds.

        Supports optimistic concurrency: pass the current `ETag` in an `If-Match` header to
        make the delete conditional; a stale precondition returns `412 Precondition Failed`.
      operationId: DeleteSignatureRecord
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      security:
        - BearerAuth: []
      responses:
        "204":
          description: The Record was deleted (or no Record was attached)
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            SASHA-Request-ID:
              $ref: "#/components/headers/SASHA-Request-ID"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "412":
          $ref: "#/components/responses/PreconditionFailedResponse"

components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
      description: |
        Base64-encoded string that contains the Client ID and Client Secret.

        The Client ID and Client Secret must each be form-url-encoded.

        The field must have the format: `Authorization: Basic <base64-encoded client_id:client_secret>`
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token obtained from `GetToken` endpoint
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        Optimistic-concurrency precondition (a strong validator). Set it to the `ETag`
        returned by a prior read or write of this Record — the signature's current
        revision, e.g. `"5"`. When present, the write is applied only if the signature's
        revision still matches; a stale precondition is rejected with `412 Precondition
        Failed` and nothing is modified. Omit for last-write-wins.
      schema:
        type: string
      example: '"5"'
  headers:
    ETag:
      description: |
        The signature's current revision as a strong validator, e.g. `"5"`. Pass it back
        in an `If-Match` header on a later write to make that write conditional.
      schema:
        type: string
      example: '"5"'
    SASHA-Request-ID:
      description: |
        The identifier of this request, set on every response. Quote it when contacting
        SASHA support: it is what joins your call to the server-side logs. On an error
        response the same value is repeated in the payload's `request_id`.
      schema:
        type: string
      example: "8f14e45f-ceea-467a-9f0b-2b3a2c5a7d61"
  responses:
    PreconditionFailedResponse:
      description: |
        The `If-Match` precondition did not match the signature's current revision;
        the Record was not modified. Re-read the Record and retry with the new `ETag`.
      headers:
        SASHA-Request-ID:
          $ref: "#/components/headers/SASHA-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ErrorResponse:
      description: An error has occurred.
      headers:
        SASHA-Request-ID:
          $ref: "#/components/headers/SASHA-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationErrorResponse:
      description: |
        The request was rejected. A validation failure lists every offending field in
        `details`; other failures carry `message` only.
      headers:
        SASHA-Request-ID:
          $ref: "#/components/headers/SASHA-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            singleViolation:
              $ref: "#/components/examples/recordValidationErrorSingleViolation"
            multipleViolations:
              $ref: "#/components/examples/recordValidationErrorMultipleViolations"
            embeddedRecordViolation:
              $ref: "#/components/examples/embedRecordValidationError"
    UnauthorizedResponse:
      description: An authorization error has occurred.
      headers:
        SASHA-Request-ID:
          $ref: "#/components/headers/SASHA-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UnauthorizedResponse"
    NotFoundResponse:
      description: The requested resource was not found.
      headers:
        SASHA-Request-ID:
          $ref: "#/components/headers/SASHA-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  callbacks:
    jobStatusChanged:
      "{$request.body#/callback_url}":
        post:
          summary: Job Status Change Callback
          description: |
            Callback notification sent when a job status changes.

            The callback payload contains the complete Job object with updated status information.
            Partners can use this callback to track the status of their jobs and get notified when the job is complete.

            ### Callback Payload Authentication

            To protect the payload of the callback from tampering in transit, SASHA provides a signature
            of the request payload using the HMAC-SHA256 algorithm. The key for the HMAC-SHA256 algorithm
            is the Callback Secret that the Partner receives from SASHA.

            The request signature is calculated over a few fields concatenated together:

            ```
            HMAC-SHA256(request_method || request_url || request_id || request_payload)
            ```

            Where `||` is the concatenation operator without any separator or padding.

            - The request method is the HTTP method of the request in uppercase, e.g. `POST`.
            - The request url is the URL of the request without the fragment and query parameters.
            - The request id is the value of the `SASHA-Request-ID` header.
            - The request payload is the JSON request body.

            The request signature is included in the `SASHA-Request-Signature` header.

            The Callback Secret used to sign the request payload is identified by its
            Callback Secret ID, returned in the `SASHA-Callback-Secret-ID` header. Use this
            header to look up the matching signing key when you have more than one Callback
            Secret configured (for example, during a key rotation). You can also pin a
            specific Callback Secret per job by passing `callback_secret_id` when submitting
            the job.

            While validating the signature is not mandatory, SASHA recommends to do so to ensure the
            payload genuinely comes from SASHA and was not modified in transit.

            #### Validating the request signature

            Your application should verify that the callback request is genuine and was sent by SASHA
            before responding to the request. This is important for securing sensitive data and protecting
            your application from abuse.

            SASHA includes the request signature in the `SASHA-Request-Signature` HTTP header.

            ##### Example

            Here is an example of how to validate the request signature for the request below:

            - Callback Secret: `MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=`
            - Request method: `POST`
            - Request url: `https://your-app.com/callbacks/sasha-job-update`
            - Request id: `aa-b-c-d-ee`
            - Request payload: `{"job_id":"44cab986-0385-470a-8e5c-c657b0543d19","type":"embed-signature","status":"completed","output_url":"https://storage.sasha.eu/1420f12bb0e7a31104f90311d6e","output_url_expires_at":"2026-01-01T13:00:00.000Z","signature_id":"340558932877813735","creator_id":1,"created_at":"2026-01-01T12:00:00.000Z","updated_at":"2026-01-01T12:00:02.000Z"}`

            The concatenated string would be:
            ```
            POSThttps://your-app.com/callbacks/sasha-job-updateaa-b-c-d-ee{"job_id":"44cab986-0385-470a-8e5c-c657b0543d19","type":"embed-signature","status":"completed","output_url":"https://storage.sasha.eu/1420f12bb0e7a31104f90311d6e","output_url_expires_at":"2026-01-01T13:00:00.000Z","signature_id":"340558932877813735","creator_id":1,"created_at":"2026-01-01T12:00:00.000Z","updated_at":"2026-01-01T12:00:02.000Z"}
            ```

            The request signature is `f3d43248aca374a88fc02bbf29711d02bea65a688f9d28cc19534caf1c5340eb`.

            ### Request Identification

            Each callback delivery includes a unique `SASHA-Request-ID` header that you can use for tracking,
            debugging, and ensuring idempotency.
          operationId: JobStatusChangedCallback
          security: []
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Job"
          parameters:
            - name: SASHA-Callback-Secret-ID
              in: header
              required: true
              schema:
                type: string
                examples:
                  - "177F01DA-34F2-4318-9763-B73876FDD7FA"
              description: |
                Identifier of the Callback Secret that was used to sign this
                callback request.

                Use it to look up the matching signing key when validating the
                `SASHA-Request-Signature`. This is how SASHA tells you which of
                your configured Callback Secrets was selected — either the one
                you pinned via `callback_secret_id` on the original job, or the
                one SASHA chose automatically when no ID was provided.

                If you only have a single Callback Secret configured, you can
                ignore this header.
            - name: SASHA-Request-Signature
              in: header
              required: true
              schema:
                type: string
              description: |
                HMAC-SHA256 signature of the request payload.

                See https://developer.sasha.eu/partner-api/api-reference/rest-api/job-status-changed-callback#callback-payload-authentication
            - name: SASHA-Request-ID
              in: header
              required: true
              schema:
                type: string
              description: Unique identifier for this callback delivery request
          responses:
            "200":
              description: Callback received successfully
            "201":
              description: Callback received successfully
            "202":
              description: Callback received successfully
            "204":
              description: Callback received successfully
            "400":
              description: Bad request
            "401":
              description: Unauthorized
            "403":
              description: Forbidden
            "404":
              description: Not found
            "500":
              description: Internal server error
            "502":
              description: Bad gateway
            "503":
              description: Service unavailable
            "504":
              description: Gateway timeout

  examples:
    embedRequestFromURLWithCallback:
      summary: Embed Signature request from URL with callback
      value:
        media_url: "https://example.com/image.jpg"
        media_mime_type: "image/jpeg"
        callback_secret_id: "177F01DA-34F2-4318-9763-B73876FDD7FA"
        callback_url: "https://your-app.com/callbacks/sasha-job-update"
    lookupRequestFromURLWithCallback:
      summary: Lookup Signature request from URL with callback
      value:
        media_url: "https://example.com/image.jpg"
        media_mime_type: "image/jpeg"
        publish_url: "https://news.example.com/articles/123"
        source_url: "https://cdn.example.com/images/abc.jpg"
        callback_secret_id: "177F01DA-34F2-4318-9763-B73876FDD7FA"
        callback_url: "https://your-app.com/callbacks/sasha-job-update"
    embedJobPending:
      summary: Embed Signature job pending
      value:
        job_id: "job_12345"
        type: "embed-signature"
        status: "pending"
        created_at: "2025-01-01T00:00:00Z"
        updated_at: "2025-01-01T00:00:00Z"
    embedJobResponsePending:
      summary: Embed Signature job pending
      value:
        job:
          job_id: "job_12345"
          type: "embed-signature"
          status: "pending"
          created_at: "2025-01-01T00:00:00Z"
          updated_at: "2025-01-01T00:00:00Z"
    lookupJobPending:
